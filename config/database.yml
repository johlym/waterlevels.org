default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: waterlevels_development

test:
  <<: *default
  database: waterlevels_test
  <% if ENV["DATABASE_URL"].present? %>
  url: <%= ENV["DATABASE_URL"] %>
  <% end %>

production:
  <<: *default
  # PS_DATABASE_URL is the lasting app connection (PlanetScale pooler, port
  # 6432). It stays after cutover; do not copy it onto DATABASE_URL.
  # DATABASE_URL is only the Heroku attachment, used while PS_DATABASE_URL is
  # unset. Leave PS_DATABASE_URL unset until the mirror is ready to take
  # traffic — a deploy with it set points the app at PlanetScale.
  # The release process hides PS_DATABASE_URL for that one command and points
  # DATABASE_URL at PS_DATABASE_DIRECT_URL so db:prepare does not use the pooler.
  # That does not change the config var the dynos read.
  url: <%= ENV["PS_DATABASE_URL"].presence || ENV["DATABASE_URL"] %>
  prepared_statements: false
