default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: waterlevels_development

test:
  <<: *default
  database: waterlevels_test
  <% if ENV["DATABASE_URL"].present? %>
  url: <%= ENV["DATABASE_URL"] %>
  <% end %>

production:
  <<: *default
  # PlanetScale pooler (port 6432). Unset PS_DATABASE_URL until cutover — while
  # it is set, production uses it instead of the Heroku DATABASE_URL attachment.
  # Release clears PS_DATABASE_URL and points DATABASE_URL at
  # PS_DATABASE_DIRECT_URL so db:prepare does not run through PgBouncer.
  url: <%= ENV["PS_DATABASE_URL"].presence || ENV["DATABASE_URL"] %>
  prepared_statements: false
