default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: waterlevels_development

test:
  <<: *default
  database: waterlevels_test
  <% if ENV["DATABASE_URL"].present? %>
  url: <%= ENV["DATABASE_URL"] %>
  <% end %>

production:
  <<: *default
  # PS_DATABASE_URL is the lasting app connection (PlanetScale pooler, port
  # 6432). DATABASE_URL is only the leftover Heroku attachment.
  # PlanetScale dashboard URLs use sslrootcert=system, which libpq on Heroku
  # does not resolve. Drop those params and pin the distro CA bundle so
  # verify-full succeeds. The URL query overrides keys in this file, so the
  # params have to be removed from the URL itself.
  <%
    database_url = ENV["PS_DATABASE_URL"].presence || ENV["DATABASE_URL"]
    planetscale = false
    if database_url.present?
      uri = URI.parse(database_url)
      planetscale = uri.host.to_s.end_with?("psdb.cloud")
      if planetscale && uri.query
        kept = URI.decode_www_form(uri.query).reject { |key, _| %w[sslmode sslrootcert].include?(key) }
        uri.query = kept.empty? ? nil : URI.encode_www_form(kept)
        database_url = uri.to_s
      end
    end
  %>
  url: <%= database_url %>
  prepared_statements: false
  <% if planetscale %>
  sslmode: verify-full
  sslrootcert: /etc/ssl/certs/ca-certificates.crt
  <% end %>
