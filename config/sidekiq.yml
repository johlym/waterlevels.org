:concurrency: 3
:queues:
  - default
  - sync
  - backfill

:scheduler:
  :schedule:
    station_catalog_sync:
      cron: "0 3 * * 0"
      class: StationCatalogSyncJob
      queue: sync
    latest_observation_sync:
      cron: "0 * * * *"
      class: LatestObservationSyncJob
      queue: sync
    history_backfill_batch:
      # Mon–Sat only; Sunday is reserved for StationCatalogSyncJob.
      # HistoryBackfillJob also no-ops on Sunday as a safety net.
      cron: "30 * * * 1-6"
      class: HistoryBackfillBatchJob
      queue: backfill
    continuous_prune:
      cron: "15 4 * * *"
      class: ContinuousPruneJob
      queue: default
