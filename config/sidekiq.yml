# Default worker: one-off / non-queue-specific jobs (prune, edge purge, etc.).
# Also owns sidekiq-scheduler so sync/history cron entries are enqueued once.
# Each dyno is ~512MB eco — keep a single thread.
:concurrency: 1
:queues:
  - default

:scheduler:
  :schedule:
    station_catalog_sync:
      cron: "0 3 * * 0"
      class: StationCatalogSyncJob
      queue: sync
    latest_observation_sync:
      # Top of the hour (slight offset); flood sync runs at :30 to oppose.
      cron: "3 * * * *"
      class: LatestObservationSyncJob
      queue: sync
    flood_stage_sync:
      # Bottom of the hour — opposes latest tip sync near :00. One job loops
      # every state with ≥30s between states.
      cron: "30 * * * *"
      class: FloodStageSyncJob
      queue: sync
    iv_repair_batch:
      # Mon–Sat hourly catch-up on USGS_API_HISTORY_IVREPAIR_KEY.
      # Tip sync enqueues IvRepairJob on tip jumps; this sweeper covers stale
      # tips and stations that missed enqueue (circuit/cooldown). Offset past
      # tip sync (:03) and flood (:30). Drained by iv_repair_worker.
      cron: "35 * * * 1-6"
      class: IvRepairBatchJob
      queue: iv_repair
    iv_repair_scar_batch:
      # Mon–Sat hourly interior-scar catch-up on USGS_API_HISTORY_IVREPAIR2_KEY.
      # Deeper holes across ~35d continuous retention with a healthy tip.
      # Isolated from tip IV repair so scar traffic cannot 429 key1.
      # Drained by iv_repair_scar_worker.
      cron: "50 * * * 1-6"
      class: IvRepairScarBatchJob
      queue: iv_repair_scar
    history_backfill_batch:
      # Mon–Sat only; Sunday is reserved for StationCatalogSyncJob.
      # HistoryBackfillJob also no-ops on Sunday as a safety net.
      # Cold/year backlog uses continuous/daily/peaks keys on historical_worker.
      cron: "5-59/10 * * * 1-6"
      class: HistoryBackfillBatchJob
      queue: backfill
    network_refresh_batch:
      # Drain unsynced on-stream neighbors. Catalog sync kicks one limited
      # pass then enqueues this; cron finishes the national set. Sunday
      # no-ops so it does not overlap StationCatalogSyncJob on sync_worker.
      cron: "12-52/10 * * * 1-6"
      class: NetworkRefreshBatchJob
      queue: sync
    continuous_prune:
      cron: "15 9 * * *"
      class: ContinuousPruneJob
      queue: default
    daily_archive_drain:
      # Offset from nightly retention (09:15) so leftover Postgres dailies
      # (ingest fallback / export catch-up) do not sit until the next UTC day.
      cron: "20 */6 * * *"
      class: DailyArchiveDrainJob
      queue: default
    admin_dashboard_counters:
      # Materialize /admin inventory Counters off the web dyno. Sync jobs also
      # enqueue this opportunistically after tip/catalog/archive/prune.
      cron: "8-58/10 * * * *"
      class: AdminDashboardCountersJob
      queue: default
