# Single basic/eco worker dyno (~512MB): keep this modest. USGS history throughput
# is capped at ~1000 req/hr/key (~0.6 req/s with two keys), so a few threads are
# enough to soak the budget without blowing RAM/DB connections.
:concurrency: 3
:queues:
  - default
  - sync
  - backfill


:scheduler:
  :schedule:
    station_catalog_sync:
      cron: "0 3 * * 0"
      class: StationCatalogSyncJob
      queue: sync
    latest_observation_sync:
      cron: "0 * * * *"
      class: LatestObservationSyncJob
      queue: sync
    flood_stage_sync:
      # Offset from latest USGS sync so category refresh trails observations.
      cron: "20 * * * *"
      class: FloodStageSyncJob
      queue: sync
    history_backfill_batch:
      # Mon–Sat only; Sunday is reserved for StationCatalogSyncJob.
      # HistoryBackfillJob also no-ops on Sunday as a safety net.
      cron: "30 * * * 1-6"
      class: HistoryBackfillBatchJob
      queue: backfill
    continuous_prune:
      cron: "15 4 * * *"
      class: ContinuousPruneJob
      queue: default
