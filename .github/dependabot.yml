version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  ignore:
    # json 3.0 made JSON.parse keywords-only. ActiveSupport 8.1 still calls
    # JSON.parse(json, options), which breaks jsonb dumps and db:test:prepare.
    - dependency-name: json
      update-types:
        - version-update:semver-major
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
